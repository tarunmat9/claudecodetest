<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 32px;
            max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 { font-size: 2.4rem; margin-bottom: 4px; letter-spacing: 1px; }
        .subtitle { opacity: 0.85; margin-bottom: 18px; font-size: 0.95rem; }
        .difficulty { margin-bottom: 16px; font-size: 0.95rem; }
        .difficulty select {
            padding: 6px 12px; border-radius: 8px; border: none;
            margin-left: 8px; background: rgba(255, 255, 255, 0.9);
            color: #333; font-weight: 600; cursor: pointer;
        }
        .status { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; min-height: 1.5em; }
        .board {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; margin-bottom: 22px;
        }
        .cell {
            aspect-ratio: 1; background: rgba(255, 255, 255, 0.15);
            border-radius: 12px; display: flex;
            align-items: center; justify-content: center;
            font-size: 3rem; font-weight: 700; cursor: pointer;
            transition: background 0.18s, transform 0.12s; user-select: none;
        }
        .cell:hover:not(.taken):not(.disabled) {
            background: rgba(255, 255, 255, 0.28); transform: scale(1.03);
        }
        .cell.x { color: #ffd166; }
        .cell.o { color: #06d6a0; }
        .cell.taken, .cell.disabled { cursor: not-allowed; }
        .cell.win { background: rgba(255, 209, 102, 0.35); animation: pulse 0.6s ease; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .scoreboard { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
        .score {
            flex: 1; background: rgba(0, 0, 0, 0.2);
            padding: 10px; border-radius: 10px;
            display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem;
        }
        .score span:last-child { font-size: 1.4rem; font-weight: 700; }
        .reset-btn {
            background: #ffd166; color: #333; border: none;
            padding: 12px 28px; font-size: 1rem; font-weight: 700;
            border-radius: 10px; cursor: pointer;
            transition: transform 0.12s, background 0.18s;
        }
        .reset-btn:hover { background: #ffdd87; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">Computer (O) goes first &mdash; You are X</p>

        <div class="difficulty">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard" selected>Hard</option>
            </select>
        </div>

        <div class="status" id="status">Your turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="scoreboard">
            <div class="score"><span>You</span><span id="score-x">0</span></div>
            <div class="score"><span>Draws</span><span id="score-d">0</span></div>
            <div class="score"><span>Computer</span><span id="score-o">0</span></div>
        </div>

        <button id="reset" class="reset-btn">New Game</button>
    </div>

    <script>
        const HUMAN = 'X';
        const COMPUTER = 'O';
        const WIN_LINES = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6],
        ];

        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('reset');
        const difficultyEl = document.getElementById('difficulty');
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreDEl = document.getElementById('score-d');
        const cells = document.querySelectorAll('.cell');

        let board = Array(9).fill('');
        let gameOver = false;
        let humanTurn = true;
        const scores = { X: 0, O: 0, D: 0 };

        function checkWinner(b) {
            for (const line of WIN_LINES) {
                const [a, c, d] = line;
                if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line };
            }
            if (b.every(cell => cell !== '')) return { winner: 'D', line: null };
            return null;
        }

        function availableMoves(b) {
            return b.reduce((acc, cell, i) => (cell === '' ? acc.concat(i) : acc), []);
        }

        function minimax(b, isMaximizing) {
            const result = checkWinner(b);
            if (result) {
                if (result.winner === COMPUTER) return { score: 10 };
                if (result.winner === HUMAN) return { score: -10 };
                return { score: 0 };
            }
            const moves = availableMoves(b);
            let bestMove = null;
            let bestScore = isMaximizing ? -Infinity : Infinity;
            for (const move of moves) {
                b[move] = isMaximizing ? COMPUTER : HUMAN;
                const { score } = minimax(b, !isMaximizing);
                b[move] = '';
                if (isMaximizing && score > bestScore) { bestScore = score; bestMove = move; }
                else if (!isMaximizing && score < bestScore) { bestScore = score; bestMove = move; }
            }
            return { score: bestScore, move: bestMove };
        }

        function findWinningMove(b, player) {
            for (const move of availableMoves(b)) {
                b[move] = player;
                const result = checkWinner(b);
                b[move] = '';
                if (result && result.winner === player) return move;
            }
            return null;
        }

        function pickComputerMove() {
            const difficulty = difficultyEl.value;
            const moves = availableMoves(board);
            if (difficulty === 'easy') return moves[Math.floor(Math.random() * moves.length)];
            if (difficulty === 'medium') {
                const win = findWinningMove(board, COMPUTER);
                if (win !== null) return win;
                const block = findWinningMove(board, HUMAN);
                if (block !== null) return block;
                return moves[Math.floor(Math.random() * moves.length)];
            }
            return minimax([...board], true).move;
        }

        function render() {
            cells.forEach((cell, i) => {
                cell.textContent = board[i];
                cell.classList.remove('x', 'o', 'win');
                if (board[i] === HUMAN) cell.classList.add('x');
                if (board[i] === COMPUTER) cell.classList.add('o');
                cell.classList.toggle('taken', board[i] !== '');
                cell.classList.toggle('disabled', !humanTurn || gameOver);
            });
        }

        function endGame(result) {
            gameOver = true;
            if (result.line) result.line.forEach(i => cells[i].classList.add('win'));
            if (result.winner === HUMAN) { statusEl.textContent = 'You win!'; scores.X += 1; }
            else if (result.winner === COMPUTER) { statusEl.textContent = 'Computer wins!'; scores.O += 1; }
            else { statusEl.textContent = "It's a draw!"; scores.D += 1; }
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreDEl.textContent = scores.D;
        }

        function computerMove() {
            if (gameOver) return;
            const move = pickComputerMove();
            if (move === undefined || move === null) return;
            board[move] = COMPUTER;
            humanTurn = true;
            const result = checkWinner(board);
            if (result) { render(); endGame(result); return; }
            statusEl.textContent = 'Your turn';
            render();
        }

        function handleCellClick(e) {
            const index = Number(e.currentTarget.dataset.index);
            if (gameOver || !humanTurn || board[index] !== '') return;
            board[index] = HUMAN;
            humanTurn = false;
            render();
            const result = checkWinner(board);
            if (result) { endGame(result); return; }
            statusEl.textContent = 'Computer thinking...';
            setTimeout(computerMove, 400);
        }

        function resetGame() {
            board = Array(9).fill('');
            gameOver = false;
            humanTurn = false;
            statusEl.textContent = 'Computer thinking...';
            render();
            setTimeout(computerMove, 500);
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
        difficultyEl.addEventListener('change', resetGame);
        resetGame();
    </script>
</body>
</html>
